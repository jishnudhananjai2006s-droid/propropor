name: Build Android app
on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Your live site address, for example https://startline.onrender.com"
        required: true
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Build debug APK
        working-directory: android
        env:
          APP_URL: ${{ github.event.inputs.app_url || vars.APP_URL || 'https://startline.onrender.com' }}
        run: gradle assembleDebug -PAPP_URL="$APP_URL" -PVERSION_CODE=${{ github.run_number }} --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: startline-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
